name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: enrollchain_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/enrollchain_test
      BLOCKCHAIN_LOCAL_CONFIG: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py spectacular --file /tmp/schema.yaml --validate --fail-on-warn
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv ../backend/.venv
      - run: ../backend/.venv/bin/pip install -r ../backend/requirements.txt
      - run: npm run test:e2e

  blockchain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - run: npm ci
      - run: npm test
      - run: docker compose -f ../docker-compose.yml config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r ../backend/requirements-dev.txt
      - name: Test deployed contract and document integrity on a real local EVM
        env:
          BLOCKCHAIN_LOCAL_CONFIG: "false"
          ENROLLCHAIN_TEST_RPC: http://127.0.0.1:8545
        run: |
          npx hardhat node --hostname 127.0.0.1 > /tmp/enrollchain-evm.log 2>&1 &
          chain_pid=$!
          trap 'kill "$chain_pid"' EXIT
          python - <<'PYTHON'
          import time
          from web3 import Web3
          for attempt in range(60):
              if Web3(Web3.HTTPProvider("http://127.0.0.1:8545")).is_connected():
                  break
              time.sleep(1)
          else:
              raise SystemExit("Test chain did not start")
          PYTHON
          cd ../backend
          pytest tests/test_evm_integration.py -q
