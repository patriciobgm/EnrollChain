{% extends "admin/login.html" %}
{% block content %}
<div id="content-main">
  <p>Technical administration. Use your authentication code if MFA is enabled.</p>
  <form action="{{ app_path }}" method="post" id="login-form">{% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}<div class="form-row">{{ field.errors }}{{ field.label_tag }} {{ field }}</div>{% endfor %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="submit-row"><input type="submit" value="Sign in"></div>
  </form>
</div>
{% endblock %}
