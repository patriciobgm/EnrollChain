server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 32m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://backend:8000;
        # Preserve the port for same-origin verification links and QR codes.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
    location ~ ^/(admin|media|private-media|static)/ { return 404; }
    location ~ \.mjs$ { types { application/javascript mjs; } try_files $uri =404; }
    location /assets/ { expires 1h; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
